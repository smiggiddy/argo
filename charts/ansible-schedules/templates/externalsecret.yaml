apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ansible-schedules
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore.name }}
  target:
    name: ansible-schedules
    creationPolicy: Owner
  data:
    {{- range $key, $property := dict "ssh-private-key" "ssh_private_key" "vault-password" "vault_password" "git-username" "git_username" "git-token" "git_token" "mattermost-webhook-url" "mattermost_webhook_url" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.secretStore.path }}
        property: {{ $property }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ansible-schedules-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore.name }}
  target:
    name: ansible-schedules-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ splitList "/" .Values.image.repository | first }}":{"auth":"{{`{{ printf "%s:%s" .username .token | b64enc }}`}}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.secretStore.path }}
        property: git_username
    - secretKey: token
      remoteRef:
        key: {{ .Values.secretStore.path }}
        property: git_token
