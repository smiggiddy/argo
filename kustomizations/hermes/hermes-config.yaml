# Single gateway process serves all profiles (default = telegram,
# family = mattermost). Secondary profiles get creds via their own
# $HERMES_HOME/profiles/<name>/.env, not process env.
# MUST be top-level: load_gateway_config() only maps the top-level key from
# config.yaml; a nested gateway.multiplex_profiles is silently ignored
# (the nested fallback in from_dict only sees legacy gateway.json). See NOTES.md.
multiplex_profiles: true

display:
  tool_progress_command: true

memory:
  provider: honcho

model:
  default: "qwen/qwen3.6-35b-a3b"
  # default: "qwen/qwen3.6-27b"
  provider: "lmstudio"
  base_url: "http://smig-mbp-llm.lab.smig.tech:1234/v1"
  context_length: 131072
  aliases:
    gemma: "lmstudio/unsloth/gemma-4-26b-a4b-it-qat"
    qwen-small: "qwen-small/qwen3-8b"
    qwen-big: "lmstudio/qwen/qwen3.6-35b-a3b"

providers:
  qwen-small:
    name: "qwen-small"
    base_url: "http://smig-inference.lab.smig.tech:8080/v1"
    model: "qwen3-8b"
    discover_models: true

  openai:
    name: "openai"
    base_url: "https://api.openai.com/v1"
    api_key: "${env:OPENAI_API_KEY}"
    models:
      - gpt-5.6-luna
      - gpt-5.4-mini
    extra_body:
      service_tier: flex

auxiliary:
  compression:
    provider: "openai"
    model: "gpt-5.4-mini"
    api_key: "${env:OPENAI_API_KEY}"
  web_extract:
    provider: "custom"
    base_url: "http://smig-inference.lab.smig.tech:8080/v1"
    model: "qwen3-8b"
