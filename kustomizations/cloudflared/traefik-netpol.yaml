# Only cloudflared may reach the cloudflare entrypoint (:8085). It trusts
# X-Forwarded-* from its peer, so nothing else in the cluster should talk to it.
# The existing entrypoints stay open to everyone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-cloudflare-entrypoint
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    # web, websecure, dashboard/ping, metrics
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9100
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8085
