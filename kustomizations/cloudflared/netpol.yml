apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: umami

          podSelector:
            matchLabels:
              app: umami

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd

          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik

          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mattermost

          podSelector:
            matchLabels:
              app: mattermost

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8085
    # vault agent init container
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 192.168.100.0/24
              - 192.168.101.0/24
              - 192.168.1.0/24
              - 10.42.0.0/16
              - 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
