apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opengym

resources:
  - ./statefulset-api.yaml
  - ./service-api.yaml
  - ./deployment-web.yaml
  - ./service-web.yaml
  - ./pvc-media.yaml
  - ./ingress.yaml

# Non-secret configuration. kustomize appends a content hash to each generated
# ConfigMap and rewrites the envFrom references below, so editing either env file
# rolls the affected pod automatically.
configMapGenerator:
  - name: opengym-api-config
    envs:
      - ./config-api.env
  - name: opengym-web-config
    envs:
      - ./config-web.env

# Single source of truth for the app version. Bump both tags together: the API and
# web images of one release belong to the same version.
images:
  - name: ghcr.io/duartesantos8/opengym-api
    newTag: "1.4.3@sha256:21d1fde39470d9c91424db51be64f5dd57c75b0b493345016f1d6e268dceae16"
  - name: ghcr.io/duartesantos8/opengym-web
    newTag: "1.4.3@sha256:e77ef879d10549acc88a888e0cd4d566592c5680bee6436b05071678fcf8b512"
