apiVersion: apps/v1
kind: Deployment
metadata:
  name: opengym-web
  labels:
    app: opengym-web
spec:
  replicas: 1
  # The exercise media lives on a ReadWriteOnce volume, so only one web pod can run
  # at a time; Recreate avoids a second pod trying to mount it mid-rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opengym-web
  template:
    metadata:
      labels:
        app: opengym-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # One-time download of the exercise images and GIFs (~140 MB). They are
        # (c) Gym visual and are fetched from upstream, not redistributed here; see
        # the project's NOTICE.md. Skipped once the volume has content.
        - name: media-download
          image: alpine/git:v2.54.0@sha256:a4bb51f1a3553df194ce679fc1db721d8bfba2046fa1a88fe9d4ac551ffbce25
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /out/img /out/gif
              if [ -z "$(ls -A /out/img 2>/dev/null)" ]; then
                git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
                cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
              fi
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: media
              mountPath: /out
      containers:
        - name: web
          image: ghcr.io/duartesantos8/opengym-web:1.3.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: opengym-web-config
          readinessProbe:
            httpGet:
              path: /
              port: web
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 30
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: media
              mountPath: /usr/share/nginx/html/img
              subPath: img
            - name: media
              mountPath: /usr/share/nginx/html/gif
              subPath: gif
            # nginx writes these at startup under a read-only root filesystem.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: opengym-media
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 8Mi
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
