apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mattermost-db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  # single instance: the default PDB has minAvailable=1 against 1 pod, so it
  # allows 0 disruptions and blocks node drains forever while protecting
  # nothing -- there is no second copy to keep serving.
  enablePDB: false
  bootstrap:
    initdb:
      database: mattermost
      owner: mattermost
      secret:
        name: mm-db-cnpg

  storage:
    size: 5Gi
    storageClass: longhorn
