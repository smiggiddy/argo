apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openwebui-db
  namespace: apps
spec:
  instances: 1
  # single instance: the default PDB has minAvailable=1 against 1 pod, so it
  # allows 0 disruptions and blocks node drains forever while protecting
  # nothing -- there is no second copy to keep serving.
  enablePDB: false
  storage:
    size: 3Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: openwebui
      owner: openwebui
      secret:
        name: openwebui-db-secret
