apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-pg
  namespace: immich
spec:
  configuration:
    destinationPath: "s3://backup/"
    endpointURL: http://smig-zima.lab.smig.tech:9000
    s3Credentials:
      accessKeyId:
        name: credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
  retentionPolicy: "14d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: db-backup
  namespace: immich
spec:
  schedule: "0 0 7 * * 5"
  backupOwnerReference: self
  cluster:
    name: immich-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
