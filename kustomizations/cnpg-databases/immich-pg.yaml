apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
spec:
  # VectorChord replaced pgvecto.rs here on 2026-09-09. The postgres major lives in
  # the catalog ref rather than inside a tag string, so renovate cannot walk this
  # cluster across a major the way it tried to in #763.
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: vectorchord
    major: 16
  instances: 1
  enableSuperuserAccess: true

  postgresql:
    shared_preload_libraries:
      - "vchord.so"

  managed:
    roles:
      - name: immich
        ensure: present
        superuser: true
        login: true
        inherit: true
        connectionLimit: -1

  storage:
    size: 8Gi
    storageClass: longhorn
    resizeInUseVolumes: true

  bootstrap:
    initdb:
      database: immich
      owner: immich
      encoding: UTF8
      localeCType: C
      localeCollate: C
      secret:
        name: immich-postgres-user
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "cube" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
        - alter role immich set search_path TO "$user", public;

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-pg
