apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-pg
  namespace: nextcloud
spec:
  instances: 2
  primaryUpdateMethod: switchover
  storage:
    size: 4Gi
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "384Mi"
      cpu: "1"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: nextcloud-pg
