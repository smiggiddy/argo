apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: umami-pg
  namespace: umami
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 15
  instances: 1
  enablePDB: false
  storage:
    size: 1Gi
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "512Mi"
  bootstrap:
    initdb:
      database: umami
      owner: app

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: umami-pg
