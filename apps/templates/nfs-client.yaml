apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-subdir-external-provisioner
  namespace: argocd
  labels:
    apps: utilities 
  annotations:
    {{ include "app.notifications" . | nindent 4 }}
spec:
  project: default
  sources:
    - repoURL: https://github.com/smiggiddy/argo
      path: charts/nfs-subdir-external-provisioner
      targetRevision: HEAD
      helm:
        parameters:
          - name: nfs.server
            value: smigs-nas.lab.smig.tech 
          - name: nfs.path
            value: /volume1/kubernetes
          - name: storageClass.defaultClass
            value: "false"
        valueFiles:
          - $values/apps-values/nfs-client.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: HEAD
      ref: values

  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: nfs-stuff

  {{ include "app.syncPolicy.manual" . | nindent 2 }}
