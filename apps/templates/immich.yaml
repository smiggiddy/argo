apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  labels:
    apps: homelab
  annotations:
    {{ include "app.notifications" . | nindent 4 }}
spec:
  destination: 
    server: {{ .Values.spec.destination.server }}
    namespace: immich
  {{ include "app.syncPolicy.automated" . | nindent 2 }}

  project: default
  sources:
    - repoURL: https://immich-app.github.io/immich-charts
      targetRevision: 0.12.0
      chart: immich
      helm:
        valueFiles:
          - $values/apps-values/immich.yaml
        valuesObject:
          server:
            controllers:
              main:
                containers:
                  main:
                    env:
                      DB_HOSTNAME: immich-pg-rw.immich.svc.cluster.local 
                      DB_USERNAME: immich
                      DB_DATABASE_NAME: immich
                      DB_PASSWORD: <path:k8s/data/argocd/immich#password>
    - repoURL: {{ .Values.repoURL }}
      targetRevision: HEAD
      ref: values
