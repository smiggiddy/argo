apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  labels:
    utilities: kube-system
  annotations:
    {{ include "app.notifications" . | nindent 4 }}
    {{ include "app.notifications.github" . | nindent 4 }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  destination:
    namespace: loki
    server: {{ .Values.spec.destination.server }}
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      targetRevision: 1.14.3
      chart: alloy
      helm:
        valueFiles:
          - $values/apps-values/alloy.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: HEAD
      ref: values
  {{ include "app.syncPolicy.automated" . | nindent 2 }}
