apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  labels:
    apps: authentik 
  annotations:
    {{ include "app.notifications" . | nindent 4 }}
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      targetRevision: 2026.8.2
      chart: authentik 
      helm:
        valueFiles:
          - $values/apps-values/authentik.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: HEAD
      ref: values
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: authentik

  {{ include "app.syncPolicy.automated" . | nindent 2 }}






