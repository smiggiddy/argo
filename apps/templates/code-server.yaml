apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: code-server
  namespace: argocd
  labels:
    apps: utilities
  annotations:
    {{ include "app.notifications" . | nindent 4 }}
spec:
  destination:
    namespace: apps
    server: {{ .Values.spec.destination.server }} 
  project: default
  sources:
    - repoURL: https://smiggiddy.github.io
      targetRevision: 3.17.3
      chart: code-server
      helm:
        valueFiles:
          - $values/apps-values/code-server.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: HEAD
      ref: values
  {{ include "app.syncPolicy.manual" . | nindent 2 }}
