apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    apps: utilities 
  annotations:
    {{ include "app.notifications" . | nindent 4 }}
  finalizers:
    # The default behaviour is foreground cascading deletion
    - resources-finalizer.argocd.argoproj.io
    

spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 85.4.0
      chart: kube-prometheus-stack
      helm:
        valueFiles:
          - $values/apps-values/prometheus-stack.yaml
        valuesObject:
          alertmanager:
            config:
              global:
                resolve_timeout: 5m

              route:
                receiver: "telegram"
                group_by: ["alertname", "namespace"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
                routes:
                  - receiver: "null"
                    matchers:
                      - alertname = "InfoInhibitor"
                  - receiver: "null"
                    matchers:
                      - severity = "info"
                  - receiver: "null"
                    matchers:
                      - alertname = "Watchdog"

              receivers:
                - name: "null"
                - name: "telegram"
                  telegram_configs:
                    - bot_token: <path:k8s/data/argocd/grafana#telegram_api_token>
                      chat_id: <path:k8s/data/argocd/grafana#telegram_chat_id>
                      parse_mode: "HTML"
                      message: |
                        {{ "{{" }} if eq .Status "resolved" {{ "}}" }}✅ RESOLVED{{ "{{" }} else {{ "}}" }}🚨 ALERT{{ "{{" }} end {{ "}}" }} <b>{{ "{{" }} .CommonAnnotations.summary {{ "}}" }}</b>
                        Status: {{ "{{" }} .Status | toUpper {{ "}}" }}
                        {{ "{{" }} range .Alerts {{ "}}" }}
                        Namespace: {{ "{{" }} .Labels.namespace {{ "}}" }}
                        Pod: {{ "{{" }} .Labels.pod {{ "}}" }}
                        Severity: {{ "{{" }} .Labels.severity {{ "}}" }}
                        Description: {{ "{{" }} .Annotations.description {{ "}}" }}
                        {{ "{{" }} end {{ "}}" }}
                      send_resolved: true

          grafana:
            additionalDataSources:
              - name: Loki
                type: loki
                access: proxy
                basicAuth: false
                url: http://loki-gateway.loki
                jsonData:
                  timeout: 300
                  maxLines: 1000
              # the-method habits dashboard queries the app's CNPG database
              # directly. Reuses the app-owner credentials from Vault — fine
              # for a single-user homelab dashboard; revisit with a read-only
              # role if more dashboards start hitting this DB.
              - name: TheMethod-PG
                uid: the-method-pg
                type: postgres
                access: proxy
                url: the-method-pg-rw.smigz.svc.cluster.local:5432
                user: the_method
                secureJsonData:
                  password: <path:k8s/data/argocd/the-method#password>
                jsonData:
                  database: the_method
                  sslmode: require
                  postgresVersion: 1700
                  maxOpenConns: 2
            grafana.ini:
              auth:
                  signout_redirect_url: "https://auth.thecodedom.com/application/o/grafana-k3s/end-session/"
                  oauth_auto_login: true
              users:
                  allow_sign_up: false
              auth.generic_oauth:
                  name: authentik
                  enabled: true
                  allow_sign_up: true
                  client_id: <path:k8s/data/argocd/authentik-grafana#clientId>
                  client_secret: <path:k8s/data/argocd/authentik-grafana#clientSecret>
                  scopes: "openid profile email"
                  auth_url: "https://auth.thecodedom.com/application/o/authorize/"
                  token_url: "https://auth.thecodedom.com/application/o/token/"
                  api_url: "https://auth.thecodedom.com/application/o/userinfo/"
                  login_attribute_path: preferred_username
                  email_attribute_path: email
                  name_attribute_path: name
                  # Optionally map user groups to Grafana roles
                  role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
              server:
                root_url: "https://grafana-k3s.lab.smig.tech"
    - repoURL: {{ .Values.repoURL }}
      targetRevision: HEAD
      ref: values
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: monitoring

  {{ include "app.syncPolicy.automated" . | nindent 2 }}

