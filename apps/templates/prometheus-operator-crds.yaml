apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  labels:
    apps: utilities
  annotations:
    {{ include "app.notifications" . | nindent 4 }}
spec:
  project: default
  # monitoring.coreos.com CRDs, previously shipped by kube-prometheus-stack.
  # ServiceMonitor/PodMonitor/PrometheusRule/ScrapeConfig objects across the
  # cluster depend on these; the VM operator converts them to VM objects.
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 32.0.2
    chart: prometheus-operator-crds
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: monitoring

  {{ include "app.syncPolicy.automated" . | nindent 2 }}
