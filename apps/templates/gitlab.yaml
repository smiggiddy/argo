apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner
  namespace: argocd
  labels:
    apps: utilities 
  annotations:
    {{ include "app.notifications" . | nindent 4 }}

spec:
  project: default
  sources:
    - repoURL: https://charts.gitlab.io
      targetRevision: 0.92.1
      chart: gitlab-runner 
      helm:
        valueFiles:
          - $values/apps-values/gitlab.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: HEAD
      ref: values


  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: gitlab-runner

  {{ include "app.syncPolicy.automated" . | nindent 2 }}
