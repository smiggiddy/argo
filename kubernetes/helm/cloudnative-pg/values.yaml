affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values:
                - "true"
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Equal
    value: "true"
    effect: NoSchedule
