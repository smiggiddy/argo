injector:
  enabled: false
server:
  dataStorage:
    size: 1Gi
    storageClass: longhorn
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/openbao: enabled
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |-
        ui = false

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"
        }

        service_registration "kubernetes" {}
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: cluster-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
    hosts:
      - host: openbao.lab.smig.tech
    tls:
      - secretName: openbao-tls
        hosts:
          - openbao.lab.smig.tech
snapshotAgent:
  enabled: true
  schedule: "0 */6 * * *"
  s3CredentialsSecret: openbao-snapshot-s3
  config:
    s3Host: garage.garage:3900
    s3Bucket: openbao-snapshots
    s3Uri: s3://openbao-snapshots
    s3ExpireDays: "30"
    s3cmdExtraFlag: "--no-ssl --region=us-east-2"
    baoAuthPath: kubernetes
    baoRole: snapshot
extraObjects:
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: openbao-snapshot
      namespace: longhorn-system
    spec:
      task: snapshot
      cron: "45 */6 * * *"
      retain: 8
      concurrency: 1
      groups: [openbao]
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: openbao-backup
      namespace: longhorn-system
    spec:
      task: backup
      cron: "45 3 * * *"
      retain: 14
      concurrency: 1
      groups: [openbao]
