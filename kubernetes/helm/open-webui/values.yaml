extraEnvVars:
  - name: DATABASE_TYPE
    value: postgresql
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: openwebui-db-secret
        key: username
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: openwebui-db-secret
        key: password
  - name: DATABASE_HOST
    value: openwebui-db-rw.apps.svc.cluster.local
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: openwebui
websocket:
  enabled: true
ollama:
  enabled: false

ingress:
  enabled: true
  className: "traefik"
  annotations: 
    cert-manager.io/cluster-issuer: cluster-ca-issuer
    external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
  host: chat.lab.smig.tech
  tls: true
  existingSecret: open-webui-tls
