# Public DNS in Cloudflare. Only DNSEndpoint objects are published, so
# ingress/service hostnames (*.lab.smig.tech) never leak to public DNS.
provider:
  name: cloudflare
sources:
  - crd
registry: txt
txtOwnerId: k3s-cloudflare
policy: sync
domainFilters:
  - thecodedom.com
  - smigz.com
extraArgs:
  cloudflare-proxied: true

# Token needs Zone:DNS:Edit + Zone:Zone:Read on the zones above.
# Secret external-dns-cloudflare comes from the ExternalSecret in app-secrets.
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare
        key: cf-api-token

resources:
  requests:
    memory: 32Mi
  limits:
    memory: 128Mi
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values:
                - "true"
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Equal
    value: "true"
    effect: NoSchedule
