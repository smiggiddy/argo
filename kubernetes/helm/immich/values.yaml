valkey:
  enabled: true
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    strategy: Recreate
immich:
  persistence:
    library:
      existingClaim: immich

machine-learning:
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          env:
            MACHINE_LEARNING_RKNN_THREADS: 2
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.4.1-armnn@sha256:35267bbc38bf0d06fabd4df512eca63581ce0916eb1885d6f238ab4fe269f46c
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              devic.es/mali: 1
  persistence:
    cache:
      type: persistentVolumeClaim
      storageClass: longhorn
    fw:
      enabled: true
      type: hostPath
      hostPath: /lib/firmware/mali_csffw.bin
      hostPathType: File
      readOnly: true
    driver:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/libmali.so
      hostPathType: File
      readOnly: true
          
server:
  controllers:
    main:
      pod:
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          env:
            DB_HOSTNAME: immich-pg-rw.immich.svc.cluster.local
            DB_USERNAME: immich
            DB_DATABASE_NAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-user
                  key: password
          securityContext:
            privileged: true
          resources:
            limits:
              devic.es/video: 1
              cpu: "4"
              memory: "7Gi"
            requests:
              cpu: "2"
              memory: "4Gi"
  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: cluster-ca-issuer
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
      hosts:
        - host: immich.lab.smig.tech
          paths:
            - path: "/"
      tls: 
       - secretName: immich-tls
         hosts:
         - immich.lab.smig.tech
    
  persistence:
    driver:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/libmali.so.1
      hostPathType: File
      readOnly: true
    opencl:
      enabled: true
      type: hostPath
      hostPath: /etc/OpenCL
      hostPathType: Directory
      readOnly: true
    mali-opencl:
      enabled: true
      type: hostPath
      hostPath: /usr/lib/aarch64-linux-gnu/mali/libMaliOpenCL.so.1
      hostPathType: File
      readOnly: true
      globalMounts:
        - path: /usr/lib/aarch64-linux-gnu/libMaliOpenCL.so.1
