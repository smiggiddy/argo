registry: noop
policy: upsert-only
sources:
  - service
  - ingress
  # tcproute/udproute sources watch v1alpha2, which Gateway API v1.6 no longer
  # serves; the informer never syncs and external-dns exits
  - gateway-httproute
provider:
  name: pihole
extraArgs:
  pihole-server: http://rpi3-ubuntu.lab.smig.tech:8080

resources:
  requests:
    memory: 64Mi
  limits:
    memory: 256Mi
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values:
                - "true"
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Equal
    value: "true"
    effect: NoSchedule
