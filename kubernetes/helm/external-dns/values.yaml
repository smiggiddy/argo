registry: noop
policy: upsert-only
sources:
  - service
  - ingress
  - gateway-httproute
  - gateway-tcproute
  - gateway-udproute
provider:
  name: pihole
extraArgs:
  pihole-server: http://rpi3-ubuntu.lab.smig.tech:8080

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values:
                - "true"
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Equal
    value: "true"
    effect: NoSchedule
