crds:
  full: true
controller:
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: In
                values:
                  - "true"
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Equal
      value: "true"
      effect: NoSchedule
workflow:
  serviceAccount:
    create: true
    name: "argo-workflow"
  rbac:
    create: true
  workflowNamespaces:
    - default
server:
  authModes:
    - server
  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        kind: Gateway
        group: gateway.networking.k8s.io
        namespace: kube-system
        sectionName: websecure
    hostnames:
      - argoworkflows.lab.smig.tech
