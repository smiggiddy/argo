image:
  rootless: true
  # Must not be older than the version that last touched the DB
  tag: 17.0.1

persistence:
  enabled: true
  claimName: forgejo-data
  storageClass: longhorn
  size: 20Gi
  labels:
    # Longhorn picks recurring jobs up from the PVC (RecurringJobs below)
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/forgejo: enabled

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    # ServiceLB hostPort 2222 on every node; never 22 (would take the nodes' sshd)
    type: LoadBalancer
    port: 2222

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

gitea:
  admin:
    username: ""

  additionalConfigFromEnvs:
    - name: FORGEJO__LFS__MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: {name: forgejo-s3, key: access_key_id}
    - name: FORGEJO__LFS__MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: {name: forgejo-s3, key: secret_access_key}
    - name: FORGEJO__ATTACHMENT__MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: {name: forgejo-s3, key: access_key_id}
    - name: FORGEJO__ATTACHMENT__MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: {name: forgejo-s3, key: secret_access_key}
    - name: FORGEJO__MAILER__SMTP_ADDR
      valueFrom:
        secretKeyRef: {name: forgejo-mailer, key: smtp_addr}
    - name: FORGEJO__MAILER__FROM
      valueFrom:
        secretKeyRef: {name: forgejo-mailer, key: from}

  # Paths follow the existing data layout under /data (the chart's work dir);
  # host keys stay in /data/ssh (built-in server default).
  config:
    APP_NAME: The CodeDom Git
    server:
      DOMAIN: git.thecodedom.com
      ROOT_URL: https://git.thecodedom.com/
      LOCAL_ROOT_URL: http://localhost:3000/
      SSH_DOMAIN: git.thecodedom.com
      SSH_PORT: 22 # advertised in clone URLs
      SSH_LISTEN_PORT: 2222 # in-pod, rootless built-in server
      LFS_START_SERVER: true
    repository:
      ROOT: /data/git/repositories
    database:
      DB_TYPE: sqlite3
      PATH: /data/data/gitea.db
      SQLITE_JOURNAL_MODE: WAL
    session:
      PROVIDER: db
    picture:
      AVATAR_UPLOAD_PATH: /data/data/avatars
      REPOSITORY_AVATAR_UPLOAD_PATH: /data/data/repo-avatars
    log:
      ROOT_PATH: /data/data/log
    mailer:
      ENABLED: true
      PROTOCOL: smtp
    lfs:
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: garage.garage:3900
      MINIO_USE_SSL: false
      MINIO_LOCATION: us-east-2
      MINIO_BUCKET: forgejo
      MINIO_BASE_PATH: lfs/
    attachment:
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: garage.garage:3900
      MINIO_USE_SSL: false
      MINIO_LOCATION: us-east-2
      MINIO_BUCKET: forgejo
      MINIO_BASE_PATH: attachments/

test:
  enabled: false

extraDeploy:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: forgejo
      namespace: forgejo
    spec:
      entryPoints: [websecure]
      routes:
        - kind: Rule
          match: Host(`git.thecodedom.com`)
          services:
            - name: forgejo-http
              port: 3000
      tls:
        secretName: git-thecodedom-com-tls
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: git-thecodedom-com
      namespace: forgejo
    spec:
      secretName: git-thecodedom-com-tls
      dnsNames:
        - git.thecodedom.com
      issuerRef:
        kind: ClusterIssuer
        name: letsencrypt
  # Longhorn: local snapshots plus backups to the configured backup target
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: forgejo-snapshot
      namespace: longhorn-system
    spec:
      task: snapshot
      cron: "0 */6 * * *"
      retain: 8
      concurrency: 1
      groups: [forgejo]
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: forgejo-backup
      namespace: longhorn-system
    spec:
      task: backup
      cron: "30 3 * * *"
      retain: 14
      concurrency: 1
      groups: [forgejo]
