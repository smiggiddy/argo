crds:
  enabled: true
config:
  enableGatewayAPI: true

affinity: &controlPlaneAffinity
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values:
                - "true"
tolerations: &controlPlaneTolerations
  - key: node-role.kubernetes.io/master
    operator: Equal
    value: "true"
    effect: NoSchedule
resources:
  requests:
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  affinity: *controlPlaneAffinity
  tolerations: *controlPlaneTolerations
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi
cainjector:
  affinity: *controlPlaneAffinity
  tolerations: *controlPlaneTolerations
  resources:
    requests:
      memory: 192Mi
    limits:
      memory: 512Mi
startupapicheck:
  affinity: *controlPlaneAffinity
  tolerations: *controlPlaneTolerations
