fullnameOverride: vm

# k3s runs apiserver, scheduler, controller-manager, kube-proxy and kubelet in
# one process sharing one metrics registry, so every component port returns
# the same metrics (https://docs.k3s.io/reference/metrics). Each node's kubelet
# /metrics is scraped once and metrics are assigned to the job names the rules
# use by name prefix (kubelet.vmScrapes.kubelet-control-plane).
# The vm-k3s-component-up VMRule copies the kubelet scrape's up series under
# each component job, for the chart's up-based rules and dashboard variables.
x-chart-scrape-off: &chartScrapeOff
  service:
    enabled: false
  vmScrape:
    enabled: false
x-control-plane-nodes: &controlPlaneNodes
  matchLabels:
    node-role.kubernetes.io/control-plane: "true"

victoria-metrics-operator:
  operator:
    disable_prometheus_converter: false
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 256Mi
  affinity: &controlPlaneAffinity
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: In
            values:
            - "true"
  tolerations: &controlPlaneTolerations
  - key: node-role.kubernetes.io/master
    operator: Equal
    value: "true"
    effect: NoSchedule

defaultDatasources:
  victoriametrics:
    # name/uid kept from kube-prometheus-stack so existing dashboards resolve
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: prometheus
        isDefault: true
  alertmanager:
    datasources:
      - name: Alertmanager
        access: proxy
        uid: alertmanager
        jsonData:
          implementation: prometheus
  extra:
    - name: VictoriaLogs
      type: victoriametrics-logs-datasource
      access: proxy
      uid: victorialogs
      url: http://victoria-logs-victoria-logs-single-server.victoria-logs.svc.cluster.local:9428
    # the-method habits dashboard queries the app's CNPG database
    # directly. Reuses the app-owner credentials from Vault — fine
    # for a single-user homelab dashboard; revisit with a read-only
    # role if more dashboards start hitting this DB.
    - name: TheMethod-PG
      uid: the-method-pg
      type: postgres
      access: proxy
      url: the-method-pg-rw.smigz.svc.cluster.local:5432
      user: the_method
      secureJsonData:
        password: $THEMETHOD_PG_PASSWORD
      jsonData:
        database: the_method
        sslmode: require
        postgresVersion: 1700
        maxOpenConns: 2

vmsingle:
  spec:
    retentionPeriod: 30d
    storage:
      storageClassName: longhorn
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values:
              - "true"

vmagent:
  spec:
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 500Mi

alertmanager:
  spec:
    replicaCount: 2
    configSecret: alertmanager-config
    affinity: *controlPlaneAffinity
    tolerations: *controlPlaneTolerations

kubelet:
  vmScrape:
    spec:
      metricRelabelConfigs:
        # chart defaults
        - &dropUid
          action: labeldrop
          regex: (uid)
        - &dropIdName
          action: labeldrop
          regex: (id|name)
        - &dropRestClientDuration
          action: drop
          source_labels: [__name__]
          regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        # agents: client-side apiserver_* etc. would pollute the apiserver job
        - action: drop
          source_labels: [__name__]
          regex: (apiserver|apiextensions|aggregator|authentication|authorization|etcd|scheduler|workqueue|watch_cache|field_validation|lasso)_.*
        - &jobKubeProxy
          action: replace
          source_labels: [__name__]
          regex: kubeproxy_.*
          target_label: job
          replacement: kube-proxy
  vmScrapes:
    kubelet:
      spec:
        selector:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
    kubelet-control-plane:
      spec:
        selector: *controlPlaneNodes
        interval: 60s
        scrapeTimeout: 30s
        # ~18-23 MiB per server (whole k3s registry); default limit is 16 MiB
        max_scrape_size: 64MiB
        metricRelabelConfigs:
          - *dropUid
          - *dropIdName
          - *dropRestClientDuration
          # high-cardinality histograms no rule uses; _sum/_count are kept.
          # apiserver_request_sli_duration_seconds_bucket stays: SLO burn-rate rules.
          - action: drop
            source_labels: [__name__]
            regex: (apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_response_sizes|apiserver_watch_events_sizes|apiserver_admission_controller_admission_duration_seconds)_bucket
          # job by name prefix; later rules win, so apiserver_admission_controller_*
          # lands in apiserver. Everything unmatched stays kubelet.
          - action: replace
            source_labels: [__name__]
            regex: (.+_controller_.+|node_collector_.+|garbagecollector_.+|pv_collector_.+|attachdetach_.+|root_ca_cert_publisher_.+|ephemeral_volume_.+)
            target_label: job
            replacement: kube-controller-manager
          - action: replace
            source_labels: [__name__]
            regex: (apiserver|apiextensions|aggregator|authentication|authorization|etcd|workqueue|watch_cache|field_validation|rest_client)_.*
            target_label: job
            replacement: apiserver
          - action: replace
            source_labels: [__name__]
            regex: scheduler_.*
            target_label: job
            replacement: kube-scheduler
          - *jobKubeProxy
    cadvisor:
      spec:
        # replaces the shared list above for cadvisor only. Drops are
        # kube-prometheus-stack's cAdvisorMetricRelabelings defaults, and they
        # must run before the id labeldrop or the non-pod cgroup drop can't match.
        metricRelabelConfigs:
          - action: drop
            source_labels: [__name__]
            regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
          - action: drop
            source_labels: [__name__]
            regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
          - action: drop
            source_labels: [__name__]
            regex: container_memory_(mapped_file|swap)
          - action: drop
            source_labels: [__name__]
            regex: container_(file_descriptors|tasks_state|threads_max)
          - action: drop
            source_labels: [__name__, scope]
            regex: container_memory_failures_total;hierarchy
          - action: drop
            source_labels: [__name__, interface]
            regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
          - action: drop
            source_labels: [__name__]
            regex: container_spec.*
          # cgroups that aren't pods (system.slice etc.)
          - action: drop
            source_labels: [id, pod]
            regex: .+;
          # chart defaults
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)

kubeApiServer:
  vmScrape:
    enabled: false

kubeScheduler:
  <<: *chartScrapeOff

kubeControllerManager:
  <<: *chartScrapeOff

kubeProxy:
  enabled: true
  <<: *chartScrapeOff

kubeEtcd:
  <<: *chartScrapeOff

extraObjects:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMRule
    metadata:
      name: vm-k3s-component-up
    spec:
      groups:
        - name: k3s-component-up
          rules:
            - record: up
              expr: up{job="kubelet",metrics_path="/metrics",node_role_kubernetes_io_control_plane="true"}
              labels:
                job: apiserver
            - record: up
              expr: up{job="kubelet",metrics_path="/metrics",node_role_kubernetes_io_control_plane="true"}
              labels:
                job: kube-scheduler
            - record: up
              expr: up{job="kubelet",metrics_path="/metrics",node_role_kubernetes_io_control_plane="true"}
              labels:
                job: kube-controller-manager
            - record: up
              expr: up{job="kubelet",metrics_path="/metrics"}
              labels:
                job: kube-proxy

  # k3s --etcd-expose-metrics serves plain http on 2381
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMNodeScrape
    metadata:
      name: vm-kube-etcd
    spec:
      scheme: http
      port: "2381"
      selector: *controlPlaneNodes
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_node_name]
          targetLabel: node
        - targetLabel: job
          replacement: kube-etcd

grafana:
  fullnameOverride: prometheus-grafana # reuses the existing storage-prometheus-grafana-0 PVC
  sidecar:
    dashboards:
      # keep sidecar dashboards out of the file provider's path below
      folder: /tmp/dashboards
  envFromSecret: grafana-secrets
  # fixed admin creds (AVP, kubernetes/kustomizations/misc/grafana-secret.yaml); without
  # this the chart renders a random password every sync and the sts rolls
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  plugins:
    # Calendar heatmap panel for the-method habits dashboard.
    - marcusolsson-calendar-panel
    - victoriametrics-logs-datasource
  dashboards:
    default:
      argocd:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/master/examples/dashboard.json
        token: ""
        curlOptions: "-sLf"
      nvidia:
        url: https://raw.githubusercontent.com/NVIDIA/dcgm-exporter/refs/heads/main/grafana/dcgm-exporter-dashboard.json
        token: ""
        curlOptions: "-sLf"
      cnpg:
        gnetId: 20417
      the-method-habits:
        url: https://raw.githubusercontent.com/smiggiddy/argo/main/grafana-dashboards/the-method/habits.json
        token: ""
        curlOptions: "-sLf"
      logs:
        url: https://raw.githubusercontent.com/smiggiddy/argo/main/grafana-dashboards/logs/logs.json
        token: ""
        curlOptions: "-sLf"
      # health of the log store itself, not the logs
      victorialogs:
        url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/master/dashboards/victorialogs.json
        token: ""
        curlOptions: "-sLf"
        datasource:
        - name: DS_PROMETHEUS
          value: Prometheus
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: "remote"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  persistence:
    enabled: true
    type: sts
    storageClassName: longhorn
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: cluster-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
    hosts:
    - grafana-k3s.lab.smig.tech
    tls:
    - secretName: smigtech-grafana-tls
      hosts:
      - grafana-k3s.lab.smig.tech
  # using argocd vault plugin so yeah
  assertNoLeakedSecrets: false
  grafana.ini:
    auth:
        signout_redirect_url: "https://auth.thecodedom.com/application/o/grafana-k3s/end-session/"
        oauth_auto_login: true
        disable_login_form: true
    auth.basic:
        enabled: false
    users:
        allow_sign_up: false
    auth.generic_oauth:
        name: authentik
        enabled: true
        allow_sign_up: true
        scopes: "openid profile email"
        auth_url: "https://auth.thecodedom.com/application/o/authorize/"
        token_url: "https://auth.thecodedom.com/application/o/token/"
        api_url: "https://auth.thecodedom.com/application/o/userinfo/"
        login_attribute_path: preferred_username
        email_attribute_path: email
        name_attribute_path: name
        # Optionally map user groups to Grafana roles
        role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
    server:
        root_url: "https://grafana-k3s.lab.smig.tech"
