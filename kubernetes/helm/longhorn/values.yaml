preUpgradeChecker:
  upgradeVersionCheck: false
upgradeCheck:
  enabled: false
ingress:
  enabled: true
  ingressClassName: traefik
  tls: true
  tlsSecret: longhorn-tls
  host: longhorn.lab.smig.tech
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca-issuer
    external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
defaultSettings:
  nodeDrainPolicy: allow-if-replica-is-stopped
  detachManuallyAttachedVolumesWhenCordoned: true
persistence:
  defaultClassReplicaCount: 2
  defaultDataLocality: "best-effort"
metrics:
  serviceMonitor:
    enabled: true
