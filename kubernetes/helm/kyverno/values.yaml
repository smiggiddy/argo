# hook Jobs pick up the global tolerations too
global:
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Equal
      value: "true"
      effect: NoSchedule
admissionController:
  nodeAffinity: &controlPlaneNodeAffinity
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values:
                - "true"
backgroundController:
  nodeAffinity: *controlPlaneNodeAffinity
cleanupController:
  nodeAffinity: *controlPlaneNodeAffinity
reportsController:
  nodeAffinity: *controlPlaneNodeAffinity
