extraArgs:
  - --proxy-domain
  - code-server.lab.smig.tech
  - --disable-telemetry
  - --disable-update-check
extraVars:
  - name: NODE_OPTIONS
    value: "--max-old-space-size=1024"
  - name: CODER_OIDC_ISSUER_URL
    value: "https://auth.thecodedom.com/application/o/code-server/"
  - name: CODER_OIDC_EMAIL_DOMAIN
    value: "gmail.com"
  - name: CODER_OIDC_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: code-server-oidc
        key: client_id
  - name: CODER_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: code-server-oidc
        key: client_secret
  - name: CODER_OIDC_SIGN_IN_TEXT
    value: "Log in with authentic"
  - name: PATH
    value: /opt/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
extraImageVolumes:
  - name: tools
    mountPath: /opt/tools
    reference: cr.smigz.com/image-volume:0.2.0-dev
    pullPolicy: IfNotPresent

image:
  tag: "latest"
persistence:
  storageClass: longhorn
extraConfigmapMounts:
  - name: code-server-settings
    mountPath: /opt/settings
    configMap: code-server-settings
    defaultMode: 420
    readOnly: true
extraInitContainers: |
  - name: sync-settings
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    imagePullPolicy: IfNotPresent
    securityContext:
      runAsUser: 1000
    command:
      - sh
      - -c
      - |
        mkdir -p /home/coder/.local/share/code-server/User
        cp /opt/settings/settings.json /home/coder/.local/share/code-server/User/settings.json
    volumeMounts:
      - name: data
        mountPath: /home/coder
      - name: code-server-settings
        mountPath: /opt/settings
        readOnly: true
ingress:
  enabled: true
  ingressClassName: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca-issuer
    traefik.ingress.kubernetes.io/router.middlewares: apps-code-server@kubernetescrd
    external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
  hosts:
    - host: code-server.lab.smig.tech
      paths: [/]
    - host: "*.code-server.lab.smig.tech"
      paths: [/]
  tls:
    - secretName: code-server-tls
      hosts: [code-server.lab.smig.tech, "*.code-server.lab.smig.tech"]
