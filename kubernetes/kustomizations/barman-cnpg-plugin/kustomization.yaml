resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.16.0/manifest.yaml
patches:
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: barman-cloud
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: In
                          values:
                            - "true"
            containers:
              - name: barman-cloud
                resources:
                  requests:
                    memory: 32Mi
                  limits:
                    memory: 128Mi
            tolerations:
              - key: node-role.kubernetes.io/master
                operator: Equal
                value: "true"
                effect: NoSchedule
