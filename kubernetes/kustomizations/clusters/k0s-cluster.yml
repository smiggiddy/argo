apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: k0s-cluster-token
spec:
  path: k8s-tokens-k0s/creds/argocd
  method: POST
  parameters:
    kubernetes_namespace: kube-system
  resultType: Data
  provider:
    server: http://openbao.openbao.svc:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: argocd-cluster-creds
        serviceAccountRef:
          name: cluster-creds
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k0s-public-cluster-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: k0s-public-cluster-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: "cluster"
          cluster: "k0s"
      data:
        name: "k0s-pub-smig-tech"
        server: "https://192.168.150.10:6443"
        config: '{{ dict "bearerToken" .service_account_token "tlsClientConfig" (dict "insecure" false "caData" .caData) | toJson }}'
  data:
    - secretKey: caData
      remoteRef:
        key: argocd/clusters
        property: k0s-ca
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: k0s-cluster-token
