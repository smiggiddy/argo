apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: the-method-postgres-credentials
  namespace: smigz
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: the-method-postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      type: kubernetes.io/basic-auth
      data:
        username: "the_method"
  data:
    - secretKey: password
      remoteRef:
        key: argocd/the-method
        property: password
