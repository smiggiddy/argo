apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgres-credentials
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      type: kubernetes.io/basic-auth
      data:
        username: "authentik"
  data:
    - secretKey: password
      remoteRef:
        key: argocd/authentik
        property: postgres
