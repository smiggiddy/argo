apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-backup-credentials
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        region: "us-east-2"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: argocd/cnpg-backups
        property: username
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: argocd/cnpg-backups
        property: password
