apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/opencloud: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-config
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/opencloud: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
