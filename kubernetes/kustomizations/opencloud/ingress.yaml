apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: opencloud-opencloud-sts@kubernetescrd
    external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - opencloud.lab.smig.tech
      secretName: opencloud-tls
  rules:
    - host: opencloud.lab.smig.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencloud
                port:
                  name: http
