apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: umami-secrets
    creationPolicy: Owner
  data:
    - secretKey: hash-salt
      remoteRef:
        key: argocd/umami
        property: hash_salt
    - secretKey: app-secret
      remoteRef:
        key: argocd/umami
        property: app_secret
