apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-token-issuer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-token-issuer
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["argocd-manager"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-token-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-token-issuer
subjects:
  - kind: ServiceAccount
    name: openbao-token-issuer
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: openbao-token-issuer-token
  annotations:
    kubernetes.io/service-account.name: openbao-token-issuer
type: kubernetes.io/service-account-token
