apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: miniflux-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: argocd/miniflux
        property: admin_password
