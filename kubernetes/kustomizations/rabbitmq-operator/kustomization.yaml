resources:
  - https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.2/cluster-operator.yml
patches:
  # CreateNamespace on the Application owns rabbitmq-system
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rabbitmq-system
  - target:
      kind: Deployment
      name: rabbitmq-cluster-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rabbitmq-cluster-operator
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: In
                          values:
                            - "true"
            # upstream reserves 500Mi; it peaks around 25Mi
            containers:
              - name: operator
                resources:
                  requests:
                    memory: 64Mi
                  limits:
                    memory: 256Mi
            tolerations:
              - key: node-role.kubernetes.io/master
                operator: Equal
                value: "true"
                effect: NoSchedule
