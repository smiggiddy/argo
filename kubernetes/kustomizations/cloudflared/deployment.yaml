# OpenBao secret k8s/data/cloudflare-tunnel-rpi-k3s: key token is the tunnel
# run token (cloudflared --token-file). api-token is the account API token
# for managing tunnels and account-id its account; neither is used here.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared

  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      serviceAccountName: cloudflared
      # cloudflared image runs as distroless nonroot
      securityContext:
        fsGroup: 65532
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            [
              "tunnel",
              "--no-autoupdate",
              "--config",
              "/etc/cloudflared/config.yaml",
              "run",
              "--token-file",
              "/etc/cloudflared-token/token",
            ]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
            - name: token
              mountPath: /etc/cloudflared-token
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: token
          secret:
            secretName: cloudflared-token
            defaultMode: 0440
