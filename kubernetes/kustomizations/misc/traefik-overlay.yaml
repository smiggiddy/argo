apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
        experimentalChannel: true
    ports:
      # cloudflared-only entrypoint; on the ClusterIP service, never the LB.
      # see cloudflared/traefik-netpol.yaml
      cloudflare:
        port: 8085
        expose:
          default: false
          internal: true
        exposedPort: 8085
        protocol: TCP
        forwardedHeaders:
          # peer is the cloudflared pod; keep its X-Forwarded-* (proto, client ip)
          trustedIPs:
            - 10.42.0.0/16
      web:
        observability:
          accessLogs: false
      websecure:
        observability:
          accessLogs: false
      traefik:
        observability:
          accessLogs: false
      metrics:
        observability:
          accessLogs: false
    logs:
      access:
        enabled: true
        format: json
        fields:
          headers:
            names:
              Cf-Connecting-Ip: keep
              User-Agent: keep
    service:
      annotations:
        external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
      additionalServices:
        internal:
          type: ClusterIP
    gateway:
      annotations:
        cert-manager.io/cluster-issuer: cluster-ca-issuer
      listeners:
        web:
          namespacePolicy:
            from: All
        websecure:
          namespacePolicy:
            from: All
          certificateRefs:
            - name: lab-smig-tech-wildcard-tls
          mode: Terminate
          hostname: "*.lab.smig.tech"
          port: 8443
          protocol: HTTPS
