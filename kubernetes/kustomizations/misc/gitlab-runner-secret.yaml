apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitlab-runner
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        runner-registration-token: "deeznuts"
        accesskey: "gitlab-runner"
  data:
    - secretKey: runner-token
      remoteRef:
        key: argocd/gitlab-runner
        property: token
    - secretKey: secretkey
      remoteRef:
        key: argocd/gitlab-runner
        property: secret-key
