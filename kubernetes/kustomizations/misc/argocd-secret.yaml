apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-argocd
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-argocd
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          app.kubernetes.io/part-of: "argocd"
  data:
    - secretKey: clientID
      remoteRef:
        key: argocd/argocd-gitea
        property: clientID
    - secretKey: clientSecret
      remoteRef:
        key: argocd/argocd-gitea
        property: clientSecret
