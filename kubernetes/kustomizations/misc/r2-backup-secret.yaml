apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-credentials
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: argocd/backups-r2
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: argocd/backups-r2
        property: secret_access_key
