apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cr-smigz-com-registry
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cr-smigz-com-registry
    creationPolicy: Owner
  data:
    - secretKey: config.json
      remoteRef:
        key: argocd/registry
        property: dockerconfig
