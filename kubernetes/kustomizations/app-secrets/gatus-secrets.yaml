apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gatus-secrets
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: argocd/gatus
        property: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: argocd/gatus
        property: TELEGRAM_CHAT_ID
    - secretKey: MATTERMOST_WEBHOOK_URL
      remoteRef:
        key: argocd/gatus
        property: MATTERMOST_WEBHOOK_URL
    - secretKey: MATTERMOST_ROOTED_AND_RISING_WEBHOOK_URL
      remoteRef:
        key: argocd/gatus
        property: MATTERMOST_ROOTED_AND_RISING_WEBHOOK_URL
