apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: external-dns-cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: external-dns-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: cf-api-token
      remoteRef:
        key: argocd/external-dns-cloudflare
        property: api-token
