apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: code-server-oidc
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: code-server-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: argocd/code-server
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: argocd/code-server
        property: client_secret
