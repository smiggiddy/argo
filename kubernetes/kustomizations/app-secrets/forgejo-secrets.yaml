apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-s3
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-s3
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      remoteRef:
        key: argocd/forgejo
        property: s3_access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: argocd/forgejo
        property: s3_secret_access_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-mailer
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-mailer
    creationPolicy: Owner
  data:
    - secretKey: smtp_addr
      remoteRef:
        key: argocd/forgejo
        property: smtp_addr
    - secretKey: from
      remoteRef:
        key: argocd/forgejo
        property: mail_from
