apiVersion: v1
kind: Secret
metadata:
  name: forgejo-s3
  namespace: forgejo
type: Opaque
stringData:
  access_key_id: <path:k8s/data/argocd/forgejo#s3_access_key_id>
  secret_access_key: <path:k8s/data/argocd/forgejo#s3_secret_access_key>
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-mailer
  namespace: forgejo
type: Opaque
stringData:
  smtp_addr: <path:k8s/data/argocd/forgejo#smtp_addr>
  from: <path:k8s/data/argocd/forgejo#mail_from>
