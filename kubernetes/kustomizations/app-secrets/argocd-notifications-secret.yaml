apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          app.kubernetes.io/part-of: "argocd"
  data:
    - secretKey: mattermost-token
      remoteRef:
        key: argocd/notifications
        property: mattermost-token
    - secretKey: github-token
      remoteRef:
        key: argocd/notifications
        property: github-token
