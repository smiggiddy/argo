apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-rpc
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garage-rpc
    creationPolicy: Owner
  data:
    - secretKey: rpcSecret
      remoteRef:
        key: argocd/garage
        property: rpc_secret
