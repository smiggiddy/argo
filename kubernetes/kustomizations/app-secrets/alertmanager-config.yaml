apiVersion: v1
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: "telegram"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        - receiver: "null"
          matchers:
            - severity = "info"
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"

    receivers:
      - name: "null"
      - name: "telegram"
        telegram_configs:
          - bot_token: <path:k8s/data/argocd/grafana#telegram_api_token>
            chat_id: <path:k8s/data/argocd/grafana#telegram_chat_id>
            parse_mode: "HTML"
            message: |
              {{ if eq .Status "resolved" }}✅ RESOLVED{{ else }}🚨 ALERT{{ end }} <b>{{ .CommonAnnotations.summary }}</b>
              Status: {{ .Status | toUpper }}
              {{ range .Alerts }}
              Namespace: {{ .Labels.namespace }}
              Pod: {{ .Labels.pod }}
              Severity: {{ .Labels.severity }}
              Description: {{ .Annotations.description }}
              {{ end }}
            send_resolved: true
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
