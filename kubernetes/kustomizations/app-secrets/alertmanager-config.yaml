apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m

          route:
            receiver: "telegram"
            group_by: ["alertname", "namespace"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: "null"
                matchers:
                  - alertname = "InfoInhibitor"
              - receiver: "null"
                matchers:
                  - severity = "info"
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"

          receivers:
            - name: "null"
            - name: "telegram"
              telegram_configs:
                - bot_token: {{ .bot_token }}
                  chat_id: {{ .chat_id }}
                  parse_mode: "HTML"
                  message: |
                    {{`{{ if eq .Status "resolved" }}✅ RESOLVED{{ else }}🚨 ALERT{{ end }} <b>{{ .CommonAnnotations.summary }}</b>
                    Status: {{ .Status | toUpper }}
                    {{ range .Alerts }}
                    Namespace: {{ .Labels.namespace }}
                    Pod: {{ .Labels.pod }}
                    Severity: {{ .Labels.severity }}
                    Description: {{ .Annotations.description }}
                    {{ end }}`}}
                  send_resolved: true
  data:
    - secretKey: bot_token
      remoteRef:
        key: argocd/grafana
        property: telegram_api_token
    - secretKey: chat_id
      remoteRef:
        key: argocd/grafana
        property: telegram_chat_id
