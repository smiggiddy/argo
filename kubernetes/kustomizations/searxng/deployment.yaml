apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: searxng
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: searxng
    spec:
      serviceAccountName: searxng
      containers:
        - image: searxng/searxng
          name: searxng
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_SETTINGS_PATH
              value: /etc/searxng-settings/settings.yml
            # keeps the SQLite engine cache on the PVC, not ephemeral /tmp
            - name: TMPDIR
              value: /var/cache/searxng
          volumeMounts:
            - name: data
              mountPath: /var/cache/searxng
            - name: settings-tpl
              mountPath: /etc/searxng-tpl
              readOnly: true
            - name: settings
              mountPath: /etc/searxng-settings
              readOnly: true
            - name: etc-searxng   # entrypoint exits 127 if it can't write here
              mountPath: /etc/searxng
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
      securityContext:
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: searxng-data
        - name: settings-tpl
          configMap:
            name: searxng-settings
        - name: settings
          secret:
            secretName: searxng-settings
            defaultMode: 0440
        - name: etc-searxng
          emptyDir: {}
