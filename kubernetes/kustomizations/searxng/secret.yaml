apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-settings
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: searxng-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - configMap:
            name: searxng-settings
            items:
              - key: settings.yml
                templateAs: Values
  data:
    - secretKey: searxng_secret
      remoteRef:
        key: argocd/searxng
        property: searxng_secret
    - secretKey: brave_api_key
      remoteRef:
        key: argocd/searxng
        property: brave_api_key
