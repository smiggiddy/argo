apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: argocd/hermes
        property: openapi_token
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: argocd/hermes
        property: telegram_token
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: argocd/hermes
        property: telegram_smig_id
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: argocd/hermes
        property: openrouter_key
---
