apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-bootstrap-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hermes-bootstrap-secrets
    creationPolicy: Owner
  data:
    - secretKey: ssh_private_key
      remoteRef:
        key: argocd/hermes
        property: ssh_private_key
