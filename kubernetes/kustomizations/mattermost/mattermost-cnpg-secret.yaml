apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mm-db-cnpg
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mm-db-cnpg
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      type: kubernetes.io/basic-auth
      data:
        username: "mattermost"
  data:
    - secretKey: password
      remoteRef:
        key: argocd/mattermost-cnpg
        property: cnpg-password
