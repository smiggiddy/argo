apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: file-store-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: file-store-credentials
    creationPolicy: Owner
  data:
    - secretKey: accesskey
      remoteRef:
        key: argocd/mattermost-s3
        property: accesskey
    - secretKey: secretkey
      remoteRef:
        key: argocd/mattermost-s3
        property: secretkey
