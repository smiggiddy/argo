apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mm-db-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mm-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_CONNECTION_STRING
      remoteRef:
        key: argocd/mattermost-db
        property: db-connection
    - secretKey: DB_CONNECTION_CHECK_URL
      remoteRef:
        key: argocd/mattermost-db
        property: db-check-connection
