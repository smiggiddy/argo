apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bentopdf
  name: bentopdf
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bentopdf
  strategy: {}
  template:
    metadata:
      labels:
        app: bentopdf
    spec:
      containers:
        - image: ghcr.io/alam00000/bentopdf:2.8.12@sha256:beec9d0e0ccb96e59dbff6d26bd7c954c89c880a8c0be5c85004ecc707736516
          name: bentopdf
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "300m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
