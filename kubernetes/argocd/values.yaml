notifications:
  # shared by every component below; tolerations are in global
  affinity: &controlPlaneAffinity
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: In
                values:
                  - "true"
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/part-of
                  operator: In
                  values:
                    - argocd
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: 115MiB
  # Subscriptions are per-Application annotations, set in kubernetes/argocd.yaml
  # and the ApplicationSet templates under kubernetes/
  secret:
    # argocd-notifications-secret (mattermost-token, github-token) comes from
    # OpenBao via the ExternalSecret in the app-secrets kustomization
    create: false
  notifiers:
    service.mattermost: |
      apiURL: http://smigtech.mattermost.svc.cluster.local:8065
      token: $mattermost-token
    service.webhook.github: |
      url: https://api.github.com
      headers:
      - name: Authorization
        value: token $github-token
  triggers:
    # Mattermost
    trigger.on-health-degraded: |
      - description: Application has degraded
        send:
        - app-health-degraded
        when: app.status.health.status == 'Degraded'
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send:
        - app-sync-failed
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-sync-status-unknown: |
      - description: Application status is 'Unknown'
        send:
        - app-sync-status-unknown
        when: app.status.sync.status == 'Unknown'
    # GitHub commit statuses
    trigger.on-sync-running-github: |
      - description: Application sync started
        oncePer: app.status.operationState?.startedAt
        send:
        - github-commit-status
        when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
    trigger.on-deployed-github: |
      - description: Application is synced and healthy. Triggered once per commit.
        oncePer: app.status.operationState?.syncResult?.revisions ?? app.status.operationState?.syncResult?.revision
        send:
        - github-commit-status
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
          and app.status.health.status == 'Healthy' and (!time.Parse(app.status.health.lastTransitionTime).Add(1
          * time.Minute).Before(time.Parse(app.status.operationState.finishedAt)) or time.Parse(app.status.health.lastTransitionTime).Before(time.Parse(app.status.operationState.startedAt)))
    trigger.on-sync-failed-github: |
      - description: Application syncing has failed
        oncePer: app.status.operationState?.startedAt
        send:
        - github-commit-status
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    defaultTriggers: |
      - on-sync-status-unknown

  templates:
    template.github-commit-status: |
      webhook:
        github:
          method: POST
          # Single-source apps use status.sync.revision; multi-source apps use the
          # revisions entry that belongs to the smiggiddy/argo source.
          path: >-
            /repos/smiggiddy/argo/statuses/
            {{- $sha := .app.status.sync.revision -}}
            {{- range $i, $s := .app.spec.sources -}}
            {{- if eq (trimSuffix ".git" $s.repoURL) "https://github.com/smiggiddy/argo" -}}
            {{- $sha = index $.app.status.sync.revisions $i -}}
            {{- end -}}
            {{- end -}}
            {{ $sha }}
          body: |
            {{- $phase := .app.status.operationState.phase -}}
            {{- $state := "pending" -}}
            {{- if eq $phase "Succeeded" }}{{ $state = "success" }}{{ end -}}
            {{- if or (eq $phase "Error") (eq $phase "Failed") }}{{ $state = "failure" }}{{ end -}}
            {
              "state": "{{ $state }}",
              "description": "Argo CD sync {{ $phase }} for {{ .app.metadata.name }}",
              "target_url": "{{ .context.argocdUrl }}/applications/{{ .app.metadata.name }}",
              "context": "argocd/{{ .app.metadata.name }}"
            }
    template.app-health-degraded: |
      mattermost:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#f4c030",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-sync-failed: |
      mattermost:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-sync-status-unknown: |
      mattermost:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: 230MiB
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  affinity: *controlPlaneAffinity

controller:
  resources:
    requests:
      cpu: 1500m
      memory: 2560Mi
    limits:
      cpu: 1500m
      memory: 2560Mi
  env:
    - name: GOMEMLIMIT
      value: 2300MiB
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
    replicas: 2
  affinity: *controlPlaneAffinity

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  env:
    - name: GOMEMLIMIT
      value: 690MiB
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
    replicas: 2
  serviceAccount:
    automountServiceAccountToken: true
  affinity: *controlPlaneAffinity
global:
  domain: argocd.lab.smig.tech
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Equal
      value: "true"
      effect: NoSchedule
configs:
  rbac:
    create: true
    policy.csv: |
      g, ArgoCD Admins, role:admin
      g, ArgoCD Viewers, role:readonly
    policy.default: role:readonly
    scopes: "[groups]"
  cm:
    admin.enabled: false
    oidc.config: |
      name: authentik
      issuer: https://auth.thecodedom.com/application/o/argo-cd-k3s/
      clientID: 4e1ebe14-d2f5-4163-a643-9f49793c5645
      cliClientID: 4e1ebe14-d2f5-4163-a643-9f49793c5645
      requestedScopes: [openid, profile, email]
      enablePKCEAuthentication: true
  params:
    server.insecure: true

dex:
  enabled: false

server:
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
  env:
    - name: GOMEMLIMIT
      value: 460MiB
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
    replicas: 2
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: cluster-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
    enabled: true
    hostname: argocd.lab.smig.tech
    ingressClassName: traefik
    tls: true

  affinity: *controlPlaneAffinity

redis:
  affinity: *controlPlaneAffinity
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi
