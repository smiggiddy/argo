# Bootstrap: kubectl apply -f kubernetes/root.yaml
# Syncs the top-level files of kubernetes/ (ApplicationSets and the few
# plain Applications); subdirectories are picked up by the ApplicationSets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/smiggiddy/argo
    targetRevision: HEAD
    path: kubernetes
    directory:
      recurse: false
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
