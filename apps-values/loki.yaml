monitoring:
  serviceMonitor:
    enabled: true
loki:
  auth_enabled: false
  storage:
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    type: s3
    s3:
      endpoint: smig-zima.lab.smig.tech:9000
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy
  tracing:
    enabled: true
  querier:
    max_concurrent: 4
read:
  replicas: 2
  persistence:
    storageClass: longhorn-noreplicas
write:
  replicas: 2
  persistence:
    storageClass: longhorn-noreplicas
backend:
  replicas: 2
chunksCache:
  enabled: false
resultsCache:
  enabled: false
