image:
  repository: excalidraw/excalidraw
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9"

ingress:
  enabled: true
  className: "traefik"
  annotations: 
    cert-manager.io/cluster-issuer: cluster-ca-issuer
    external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."
  hosts:
  - host: excalidraw.lab.smig.tech
    paths:
    - path: /
      pathType: Prefix
  tls: 
  - secretName: excalidraw-tls
    hosts:
    - excalidraw.lab.smig.tech
