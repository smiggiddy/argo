resources: 
  limits:
   cpu: 1000m
   memory: 768Mi
  requests:
   cpu: 500m
   memory: 256Mi
metrics:
  enabled: true

rbac:
  enabled: true
image:
  flavor: fpm
nginx:
  enabled: true
  # unprivileged variant keeps its pid/temp files in /tmp so it can run as 101
  image:
    repository: nginxinc/nginx-unprivileged
    tag: alpine
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 128Mi
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  config:
    headers:
      "Strict-Transport-Security": "max-age=15552000; includeSubDomains; preload;"
phpClientHttpsFix:
  enabled: false 
  protocol: https
redis:
  enabled: false
# With nginx enabled the chart only puts liveness on the nginx container, so a
# slow PHP-FPM gets nginx killed (exit 0 "Completed") and never restarts PHP.
# Readiness still pulls the pod from the service when status.php fails.
livenessProbe:
  enabled: false
# crond needs root, so run cron.php from a CronJob as www-data instead of the
# sidecar
cronjob:
  enabled: true
  type: cronjob
  cronjob:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        # php memory_limit is 512M
        memory: 768Mi
    securityContext:
      runAsUser: 33
      runAsGroup: 33
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    # longhorn RWO volume: must land on the same node as the app pod
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: nextcloud
                app.kubernetes.io/component: app
            topologyKey: kubernetes.io/hostname
persistence:
  enabled: true
  storageClass: longhorn
  size: 30Gi
externalDatabase:
  enabled: true
  host: "nextcloud-pg-rw:5432"
  type: postgresql
  database: app
  existingSecret:
    enabled: true
    secretName: nextcloud-pg-app
    usernameKey: username
    passwordKey: password
internalDatabase:
  enabled: false
postgresql:
  enabled: false
nextcloud:
  # www-data in the debian fpm image; php-fpm workers already ran as this user
  securityContext:
    runAsUser: 33
    runAsGroup: 33
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  podSecurityContext:
    # keep the chart's existing group so the volume isn't re-chgrp'd, and stop
    # the recursive chgrp of the whole volume on every pod start
    fsGroup: 82
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    # lets nginx bind :80 as non-root (tailnet clients reach the pod on 80)
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"
  defaultConfigs:
    .htaccess: false
    apache-pretty-urls.config.php: false
    swift.config.php: false
  configs:
    logging.config.php: |-
      <?php
      $CONFIG = array (
        'log_type' => 'file',
        'logfile' => 'nextcloud.log',
        'loglevel' => 2,
        'logdateformat' => 'F d, Y H:i:s',
        'log_rotate_size' => 10 * 1024 * 1024
        );
    trusted_domains.config.php: |-
        <?php
        $CONFIG = [
        'trusted_domains' =>
          array (
            0 => 'localhost',
            1 => 'cloud.lab.smig.tech',
            2 => 'cloud.vpn.thecodedom.com'
            )
          ];
  host: cloud.lab.smig.tech
  existingSecret:
    enabled: true
    secretName: nextcloud-db
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  extraSidecarContainers:
    - name: ts-sidecar
      imagePullPolicy: Always
      image: "ghcr.io/tailscale/tailscale:latest@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d"
      resources:
        limits:
          devic.es/tun: "1"
          memory: 128Mi
        requests:
          devic.es/tun: "1"
          cpu: 10m
          memory: 32Mi
      env:
      - name: TS_HOSTNAME
        value: cloud
      - name: TS_KUBE_SECRET
        value: tailscale-auth-nextcloud
      - name: TS_USERSPACE
        value: "false"
      - name: TS_EXTRA_ARGS
        valueFrom:
          secretKeyRef:
            name: tailscale-auth-nextcloud
            key: extra_args
            optional: true
      - name: TS_AUTHKEY
        valueFrom:
          secretKeyRef:
            name: tailscale-auth-nextcloud
            key: TS_AUTHKEY
            optional: true
      securityContext:
        capabilities:
          add:
          - NET_ADMIN
ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: nextcloud-nextcloud-middleware@kubernetescrd,nextcloud-nextcloud-middleware-sts@kubernetescrd
    external-dns.alpha.kubernetes.io/target: "k3s.lab.smig.tech."

  enabled: true
  className: traefik
  tls:
   - secretName: cloud-tls
     hosts:
     - cloud.lab.smig.tech
