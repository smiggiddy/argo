registry: noop
provider:
  name: pihole
  pihole:
    server: http://rpi3-ubuntu.lab.smig.tech
extraArgs:
  source: 
  - service
  - ingress
  - gateway-httproute
  # - gateway-tlsroute
  - gateway-tcproute
  - gateway-udproute
  pihole-api-version: 6
  pihole-server: http://rpi3-ubuntu.lab.smig.tech:8080
rbac:  
  additionalPermissions: 
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways","httproutes","tlsroutes","tcproutes","udproutes"] 
    verbs: ["get","watch","list"]
  - apiGroups: [""]
    resources: ["namespaces"] 
    verbs: ["get","watch","list"]
